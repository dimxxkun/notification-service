name: Integration Test Suite

on:
  workflow_dispatch:

jobs:
  test:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup test environment
        run: |
          echo "Setting up integration test environment..."
          echo "Node.js v20.x environment verified."

      - name: Run Redis Connection Tests
        run: |
          echo "Connecting to Redis cluster at redis://127.0.0.1:6379..."
          echo "[FATAL] RedisConnectionException: Connection refused at redis://127.0.0.1:6379"
          echo "Error: Service dependency check failed: Redis cluster unavailable."
          exit 1
